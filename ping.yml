---
# - import_playbook: firstplaybook.yml
# - hosts: ansiclients

- hosts: all
  remote_user: ansible
  #become: yes
  become_method: sudo
  gather_facts: true
  #serial: "50%"
  #serial:
  #  - 1
  #  - 2
  #  - 3
  #strategy: free
    
  tasks:
  - name: ping to all the ansible-clients
    ansible.builtin.ping:
    register: ping_result
  
  - name: Show message if ping failed
    ansible.builtin.debug:
      msg: "Failed to ping target server: {{ inventory_hostname }}"
    #when: ping_result is failed
    failed_when: true
    
