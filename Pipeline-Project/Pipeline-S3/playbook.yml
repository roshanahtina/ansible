---
- hosts: all
  become: yes
  gather_facts: true

  tasks:

    - name: Memory Check
      script: mem_check.sh
      register: mem_result
      when: memory_check | bool
    - name: Show Memory Result
      debug:
        msg: "{{ mem_result.stdout_lines | select('search', '\\S') | list }}"
      when: memory_check | bool

    - name: Load Check
      script: load_check.sh
      register: load_result
      when: load_check | bool
    - name: Show Load Result
      debug:
        msg: "{{ load_result.stdout_lines | select('search', '\\S') | list }}"
      when: load_check | bool

    - name: Disk Check
      script: disk_check.sh
      register: disk_result
      when: disk_check | bool
    - name: Show Disk Result
      debug:
        msg: "{{ disk_result.stdout_lines | select('search', '\\S') | list }}"
      when: disk_check | bool

    - name: Network Check
      script: network_check.sh
      register: network_result
      when: network_check | bool
    - name: Show Network Result
      debug:
        msg: "{{ network_result.stdout_lines | select('search', '\\S') | list }}"
      when: network_check | bool

    - name: Process Check
      script: process_check.sh
      register: process_result
      when: process_check | bool
    - name: Show Process Result
      debug:
        msg: "{{ process_result.stdout_lines | select('search', '\\S') | list }}"
      when: process_check | bool
