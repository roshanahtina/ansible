---
- hosts: ansiclients
  remote_user: ansible
  become: yes
  become_method: sudo
  gather_facts: true

  tasks:
  - name: "Gathering the ec2-user information"
    user: 
      name: ansible
      password: "{{ ansible_user_password }}" 
      comment: "Controller Ansible Admin"
    register: userinfo
  - debug:
      msg: "Output of the user creation called ANSIBLE: {{ userinfo }}"
